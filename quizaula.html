<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizAula</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--tx:#1f1b3a;--mut:#6b6788;--pri:#5b3df5;--bd:#dcd6f5;--c0:#e5334b;--c1:#2f7de1;--c2:#e8a710;--c3:#2aa84a;--ok:#2aa84a;--no:#e5334b}
@media(prefers-color-scheme:dark){:root{--bg:#15122b;--card:#221d45;--tx:#f1eeff;--mut:#a9a3d1;--bd:#3b3469;--pri:#8a74ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:18px}
h1{font-size:2rem;margin:.2em 0;text-align:center}h2{margin:.3em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:14px 0}
.mut{color:var(--mut)}.c{text-align:center}
input{width:100%;padding:12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;margin:5px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:var(--pri);color:#fff;font-weight:700}
button.sec{background:transparent;color:var(--pri);border:2px solid var(--pri)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.avs button{background:var(--bg);font-size:1.6rem;padding:6px;border:3px solid transparent}
.avs button.on{border-color:var(--pri)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{min-height:90px;font-size:1.1rem;color:#fff}
.o0{background:var(--c0)}.o1{background:var(--c1)}.o2{background:var(--c2)}.o3{background:var(--c3)}
.opt.dim{opacity:.35}.opt.right{outline:5px solid var(--tx)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);width:100%}
.big{font-size:1.4rem;font-weight:700}
.pl{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:20px;padding:6px 12px;margin:3px}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.lb .n{flex:1}
.q{border:1px dashed var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.fb{font-size:1.3rem;font-weight:800;text-align:center;margin:12px 0}
.url{word-break:break-all;background:var(--bg);padding:10px;border-radius:10px;font-family:monospace}
@media(max-width:480px){.opts{grid-template-columns:1fr}.avs{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const AV=['🦊','🐼','🐸','🦁','🐙','🦄','🐯','🐵','🐧','🐢','🦉','🐬','🐰','🐨','🦖','🐝'];
const LIMIT=20;
const $=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={role:null,code:'',pid:null,me:null,st:null,q:null,fb:null,msg:'',title:'',qs:[{q:'',o:['','','',''],c:0}],name:'',av:AV[0],view:'home',conn:null,ready:false};
let timer=null,peer=null,G=null;
const link=c=>location.href.split('#')[0]+'#'+c;

// ---------- utilidades ----------
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffled(n,seed){const r=rng(seed),a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const mkCode=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join('');
const openPeer=id=>new Promise((res,rej)=>{const p=id?new Peer(id):new Peer();p.on('open',()=>res(p));p.on('error',rej)});

// ================= PROFESOR (este navegador es el servidor) =================
const roster=()=>[...G.players.values()].map(p=>({name:p.name,avatar:p.avatar,score:p.score,done:p.answers.length})).sort((a,b)=>b.score-a.score);
function broadcast(){
  const base={title:G.title,status:G.status,total:G.questions.length,players:roster()};
  S.st=base;if(S.role==='host')render();
  G.players.forEach(p=>{if(p.conn&&p.conn.open)p.conn.send({t:'status',...base})});
}
function nextQuestion(p){
  if(p.answers.length>=G.questions.length)return{t:'q',done:true};
  const qi=shuffled(G.questions.length,p.seed)[p.answers.length],oo=shuffled(4,p.seed+qi+1),q=G.questions[qi];
  p.cur={qi,oo,t:Date.now()};
  return{t:'q',k:p.answers.length,total:G.questions.length,q:q.q,options:oo.map(i=>q.o[i]),limit:LIMIT};
}
function hostHandle(conn,m){
  let p=conn.pid&&G.players.get(conn.pid);
  if(m.t==='join'){
    p=m.pid&&G.players.get(m.pid);
    if(!p){
      const name=String(m.name||'').trim().slice(0,20);
      if(!name)return conn.send({t:'err',msg:'Escribe tu nombre.'});
      if(G.status==='ended')return conn.send({t:'err',msg:'Esta partida ya terminó.'});
      m.pid=Math.random().toString(36).slice(2,10);
      p={name,avatar:String(m.avatar||'🦊').slice(0,8),seed:Math.floor(Math.random()*2**31),score:0,answers:[],cur:null};
      G.players.set(m.pid,p);
    }
    p.conn=conn;conn.pid=m.pid;
    conn.send({t:'joined',pid:m.pid,me:{name:p.name,avatar:p.avatar},title:G.title,status:G.status});
    return broadcast();
  }
  if(!p)return;
  if(m.t==='q'){
    if(G.status!=='playing')return conn.send({t:'q',wait:true});
    if(p.cur){const q=G.questions[p.cur.qi];return conn.send({t:'q',k:p.answers.length,total:G.questions.length,q:q.q,options:p.cur.oo.map(i=>q.o[i]),limit:LIMIT})}
    conn.send(nextQuestion(p));
  }
  if(m.t==='a'&&p.cur&&G.status==='playing'){
    const q=G.questions[p.cur.qi],t=(Date.now()-p.cur.t)/1000;
    const ok=m.pick>=0&&t<=LIMIT+3&&p.cur.oo[m.pick]===q.c;
    const pts=ok?500+Math.round(500*(1-Math.min(t,LIMIT)/LIMIT)):0,right=p.cur.oo.indexOf(q.c);
    p.score+=pts;p.answers.push({ok,pts});p.cur=null;
    conn.send({t:'r',ok,pts,right,score:p.score});broadcast();
  }
}
async function createGame(){
  const qs=S.qs.filter(x=>x.q.trim()&&x.o.every(o=>o.trim()));
  if(!qs.length){S.msg='Completa al menos una pregunta con sus 4 opciones.';return render()}
  S.msg='Creando partida…';render();
  for(let i=0;i<5&&!peer;i++){const code=mkCode();
    try{peer=await openPeer('quizaula-'+code);S.code=code}catch(e){peer=null;if(e.type!=='unavailable-id'){S.msg='No se pudo conectar a internet (PeerJS).';return render()}}}
  if(!peer){S.msg='Intenta de nuevo.';return render()}
  G={title:S.title.trim()||'Mi quiz',questions:qs,status:'lobby',players:new Map()};
  peer.on('connection',c=>c.on('data',m=>hostHandle(c,m)));
  S.role='host';S.msg='';location.hash=S.code;broadcast();
}
const setStatus=s=>{G.status=s;broadcast()};

// ================= ESTUDIANTE =================
async function startPlayer(code){
  S.role='player';S.code=code;S.pid=sessionStorage.getItem('pid_'+code);S.msg='';render();
  try{peer=await openPeer()}catch(e){S.msg='No se pudo conectar a internet.';return render()}
  peer.on('error',e=>{S.msg=e.type==='peer-unavailable'?'No existe una partida con ese código (o el profesor cerró la página).':'Error de conexión.';S.ready=false;render()});
  const conn=peer.connect('quizaula-'+code,{reliable:true});S.conn=conn;
  conn.on('open',()=>{S.ready=true;S.msg='';if(S.pid)conn.send({t:'join',pid:S.pid});render()});
  conn.on('close',()=>{S.ready=false;S.msg='Se perdió la conexión con el profesor.';render()});
  conn.on('data',playerHandle);
}
function playerHandle(m){
  if(m.t==='err'){S.msg=m.msg;return render()}
  if(m.t==='joined'){S.pid=m.pid;S.me=m.me;S.title=m.title;S.msg='';sessionStorage.setItem('pid_'+S.code,m.pid);if(m.status==='playing')S.conn.send({t:'q'});return render()}
  if(m.t==='status'){const prev=S.st&&S.st.status;S.st=m;if(!S.me)return;
    if(m.status==='playing'&&prev!=='playing'){S.fb=null;S.conn.send({t:'q'})}else if(m.status!=='playing'||!S.q)render();return}
  if(m.t==='q'){S.q=m;S.fb=null;return render()}
  if(m.t==='r'){S.fb={...m,pick:S.pick};render();setTimeout(()=>S.conn.send({t:'q'}),1600)}
}
function answer(pick){if(S.fb||!S.q||S.q.done)return;clearInterval(timer);S.pick=pick;S.fb={pending:true,pick};render();S.conn.send({t:'a',pick})}
const joinGame=()=>{if(!S.name.trim()){S.msg='Escribe tu nombre.';return render()}S.conn.send({t:'join',name:S.name,avatar:S.av})};

// ================= VISTAS =================
const players=()=>(S.st?.players||[]).map(p=>`<span class="pl">${esc(p.avatar)} ${esc(p.name)}</span>`).join('')||'<span class="mut">Esperando estudiantes…</span>';
const board=()=>(S.st?.players||[]).map((p,i)=>`<div class="lb"><span class="big">${i+1}</span><span style="font-size:1.6rem">${esc(p.avatar)}</span><span class="n">${esc(p.name)}<br><small class="mut">${p.done}/${S.st.total} respondidas</small></span><b>${p.score}</b></div>`).join('')||'<p class="mut c">Aún no hay estudiantes.</p>';

function render(){
  clearInterval(timer);
  const m=S.msg?`<p class="c" style="color:var(--no)">${esc(S.msg)}</p>`:'';
  if(!S.role){
    if(S.view==='create'){
      $.innerHTML=`<h1>Crear quiz</h1><div class="card"><input id="t" placeholder="Título del quiz" value="${esc(S.title)}">
      ${S.qs.map((x,i)=>`<div class="q"><b>Pregunta ${i+1}</b> ${S.qs.length>1?`<button class="sec" style="float:right;padding:4px 10px" data-del="${i}">✕</button>`:''}
      <input data-q="${i}" placeholder="Escribe la pregunta" value="${esc(x.q)}">
      ${x.o.map((o,j)=>`<div class="row" style="flex-wrap:nowrap"><input type="radio" name="r${i}" data-c="${i}:${j}" ${x.c===j?'checked':''} style="flex:0 0 22px"><input data-o="${i}:${j}" placeholder="Opción ${j+1}${x.c===j?' (correcta)':''}" value="${esc(o)}"></div>`).join('')}</div>`).join('')}
      <div class="row"><button class="sec" id="addq">+ Pregunta</button><button id="go">Crear partida</button></div>${m}
      <p class="mut">Marca con el círculo la respuesta correcta.</p></div><p class="c"><button class="sec" id="back">Volver</button></p>`;
      $.querySelector('#t').oninput=e=>S.title=e.target.value;
      $.querySelectorAll('[data-q]').forEach(e=>e.oninput=()=>S.qs[+e.dataset.q].q=e.value);
      $.querySelectorAll('[data-o]').forEach(e=>e.oninput=()=>{const[a,b]=e.dataset.o.split(':');S.qs[a].o[b]=e.value});
      $.querySelectorAll('[data-c]').forEach(e=>e.onchange=()=>{const[a,b]=e.dataset.c.split(':');S.qs[a].c=+b;render()});
      $.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{S.qs.splice(+e.dataset.del,1);render()});
      $.querySelector('#addq').onclick=()=>{S.qs.push({q:'',o:['','','',''],c:0});render()};
      $.querySelector('#go').onclick=createGame;$.querySelector('#back').onclick=()=>{S.view='home';S.msg='';render()};
      return;
    }
    $.innerHTML=`<h1>🎓 QuizAula</h1><p class="c mut">Preguntas en vivo para tu clase</p>
    <div class="card"><h2>Soy estudiante</h2><input id="cd" placeholder="Código de la partida" maxlength="4" style="text-transform:uppercase"><button id="j" style="width:100%;margin-top:8px">Entrar</button></div>
    <div class="card"><h2>Soy profesor</h2><button id="n" style="width:100%">Crear un quiz</button></div>`;
    $.querySelector('#j').onclick=()=>{const c=$.querySelector('#cd').value.trim().toUpperCase();if(c){location.hash=c;startPlayer(c)}};
    $.querySelector('#n').onclick=()=>{S.view='create';render()};return;
  }
  const st=S.st;
  if(S.role==='host'){
    const warn=location.protocol==='file:'?'<p style="color:var(--no)">⚠ Estás abriendo el archivo desde tu PC: este enlace no funcionará para los estudiantes. Sube el archivo a Netlify Drop o GitHub Pages y ábrelo desde esa dirección.</p>':'';
    $.innerHTML=`<h1>${esc(st.title)}</h1>
    <div class="card c"><p class="mut">Comparte este enlace con tus estudiantes</p><div class="url">${esc(link(S.code))}</div>
    <p class="mut">o el código</p><div style="font-size:3rem;font-weight:900;letter-spacing:.2em">${S.code}</div>${warn}
    <button class="sec" id="cp">Copiar enlace</button><p class="mut">No cierres ni recargues esta pestaña mientras dure la clase.</p></div>
    <div class="card"><div class="row"><b>Estado: ${{lobby:'Sala de espera',playing:'En juego',ended:'Terminado'}[st.status]}</b>
    ${st.status==='lobby'?'<button id="st">▶ Iniciar</button>':st.status==='playing'?'<button id="en">■ Terminar</button>':''}</div></div>
    <div class="card"><h2>${st.status==='lobby'?`Estudiantes (${st.players.length})`:'Ranking en vivo'}</h2>${st.status==='lobby'?players():board()}</div>
    <p class="c"><button class="sec" id="new">Nuevo quiz</button></p>`;
    $.querySelector('#cp').onclick=e=>{navigator.clipboard?.writeText(link(S.code));e.target.textContent='¡Copiado!'};
    const a=$.querySelector('#st');if(a)a.onclick=()=>setStatus('playing');
    const b=$.querySelector('#en');if(b)b.onclick=()=>setStatus('ended');
    $.querySelector('#new').onclick=()=>{if(confirm('Se cerrará la partida actual. ¿Continuar?')){location.hash='';location.reload()}};return;
  }
  // estudiante
  if(!S.me){
    $.innerHTML=`<h1>🎓 QuizAula</h1><div class="card">${S.ready?`<input id="nm" placeholder="Tu nombre" maxlength="20" value="${esc(S.name)}">
    <p class="mut">Elige tu avatar</p><div class="avs">${AV.map(a=>`<button data-a="${a}" class="${a===S.av?'on':''}">${a}</button>`).join('')}</div>
    <button id="j" style="width:100%;margin-top:12px">¡Unirme!</button>`:`<p class="c mut">${S.msg?'':'Conectando con el profesor…'}</p>`}${m}</div>`;
    const nm=$.querySelector('#nm');if(nm)nm.oninput=e=>S.name=e.target.value;
    $.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{S.av=b.dataset.a;render()});
    const j=$.querySelector('#j');if(j)j.onclick=joinGame;return;
  }
  const head=`<div class="row" style="flex-wrap:nowrap"><span class="big">${esc(S.me.avatar)} ${esc(S.me.name)}</span></div>${m}`;
  if(!st||st.status==='lobby'){$.innerHTML=`<h1>${esc(S.title)}</h1><div class="card c">${head}<p class="mut">¡Estás dentro! Espera a que el profesor inicie…</p>${players()}</div>`;return}
  if(st.status==='ended'||(S.q&&S.q.done)){$.innerHTML=`<h1>${st.status==='ended'?'🏆 Resultados':'✅ ¡Terminaste!'}</h1><div class="card c">${head}${st.status==='ended'?'':'<p class="mut">Esperando a los demás…</p>'}</div><div class="card">${board()}</div>`;return}
  if(!S.q||S.q.wait){$.innerHTML=`<div class="card c">${head}<p class="mut">Cargando pregunta…</p></div>`;return}
  const q=S.q,f=S.fb;
  $.innerHTML=`${head}<div class="card c"><div class="mut">Pregunta ${q.k+1} de ${q.total}</div><h2>${esc(q.q)}</h2><div class="bar"><i id="bar"></i></div></div>
  <div class="opts">${q.options.map((o,p)=>`<button class="opt o${p} ${f&&!f.pending?(p===f.right?'right':'dim'):''}" data-p="${p}" ${f?'disabled':''}>${esc(o)}</button>`).join('')}</div>
  ${f&&!f.pending?`<div class="fb" style="color:var(--${f.ok?'ok':'no'})">${f.ok?`¡Correcto! +${f.pts}`:f.pick<0?'Se acabó el tiempo':'Incorrecto'}</div>`:''}`;
  $.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>answer(+b.dataset.p));
  if(!f){const bar=$.querySelector('#bar'),t0=Date.now();timer=setInterval(()=>{const left=1-(Date.now()-t0)/1000/q.limit;bar.style.width=Math.max(0,left*100)+'%';if(left<=0)answer(-1)},150)}
}
const h=location.hash.slice(1).toUpperCase();
if(h)startPlayer(h);else render();
</script>
</body>
</html>
